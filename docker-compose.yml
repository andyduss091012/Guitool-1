# Local backend dependencies for Guitool (Phase 1+). Frontend compose lives in web/docker-compose.yml.
#
#   docker compose up -d            # start Postgres + Azurite
#   docker compose ps               # both should be "healthy"/"running"
#   docker compose down             # stop (data kept in named volumes)
#   docker compose down -v          # stop AND delete all local data
#
# Credentials come from `.env` (copy `.env.example`). They are for local development only.

name: guitool-backend

services:
  postgres:
    image: postgres:17
    container_name: guitool-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guitarapp}
      POSTGRES_USER: ${POSTGRES_USER:-guitarapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guitarapp_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-guitarapp} -d ${POSTGRES_DB:-guitarapp}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The API. Build: `docker compose build api`; run: `docker compose up -d api` (starts Postgres first).
  # It applies EF migrations on start. Load data with the importer from your machine:
  #   dotnet run --project backend/tools/GuitarApp.Importer      (talks to Postgres on localhost:5432)
  # Then browse http://localhost:5080/swagger and http://localhost:5080/api/songs
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guitool-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-guitarapp};Username=${POSTGRES_USER:-guitarapp};Password=${POSTGRES_PASSWORD:-guitarapp_dev}
      Database__MigrateOnStartup: 'true'
      Swagger__Enabled: 'true'
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:8080
    ports:
      - '${API_PORT:-5080}:8080'
    restart: unless-stopped

  # Local stand-in for Azure Blob Storage (used from Phase 2: tab files).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: guitool-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - '10000:10000' # blob
      - '10001:10001' # queue
      - '10002:10002' # table
    volumes:
      - azurite-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  azurite-data:
